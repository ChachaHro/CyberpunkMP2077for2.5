name: 'Build windows'

on:
  workflow_dispatch:   # lancement manuel (gh workflow run)
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'port-*'   # 2.5 port branches

# NOTE: pnpm doesn't support command 'ci' for now.
#
#env:
#  IS_CI: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        # Only needed if a submodule points to a private repository: set the SUBMODULES_TOKEN secret
        # to a read-only GitHub token for it.
        shell: bash
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "$SUBMODULES_TOKEN" ]; then
            git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/ChachaHro/".insteadOf "https://github.com/ChachaHro/"
          fi
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: 'Cache xmake dependencies'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      # Install pnpm for better disk/cache performance
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Fix long path issue
      - name: Setup pnpm
        run: pnpm config set virtual-store-dir-max-length=50

      # Install xmake
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2 # Sync with cache key too (version utilisée pour le portage 2.5)
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-3.1.2

      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

      # Build the game
      - name: 'Build with xmake'
        run: xmake -y

      # Install node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            code/launcher/pnpm-lock.yaml
            code/launcher/electron/pnpm-lock.yaml

      - name: 'Generate build'
        run: xmake install -o distrib

      - name: 'Package build'
        run: xmake pack

      - name: 'Upload Artifact'
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/xpack/Cyberpunk Multiplayer/Artifacts.zip
